on:
  push:
    tags:
      - 'dryrun/[0-9]+.[0-9]+.[0-9]+'
      - 'release/[0-9]+.[0-9]+.[0-9]+'

name: 📦 Publish extension
run-name: Publish extension (${{ github.ref_name }})

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check release mode
        id: releaseMode
        # perform secret check & put boolean result as an output
        shell: bash
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          if [[ "$GIT_REF" = "refs/tags/dryrun"* ]]; then
            echo "dryRun=true" >> $GITHUB_OUTPUT;
          else
            echo "dryRun=false" >> $GITHUB_OUTPUT;
          fi
      - name: Bootstrap checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote remove origin 2>/dev/null || true
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          FETCH_ARGS=(--no-tags --prune --depth 1 origin "${TRIGGER_REF}")
          if [ -n "${GITHUB_TOKEN}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            git -c "http.${SERVER_URL}/.extraheader=AUTHORIZATION: basic ${AUTH_B64}" fetch "${FETCH_ARGS[@]}"
          else
            git fetch "${FETCH_ARGS[@]}"
          fi
          git checkout -q --detach FETCH_HEAD
      - name: Set up and install
        uses: ./.github/actions/fleet/setup-and-install
        with:
          socket-api-token: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
          payload-token-client-id: ${{ vars.SOCKET_PR_CLIENT_ID }}
          payload-token-private-key: ${{ secrets.SOCKET_PR_APP_PRIVATE_KEY }}
      - name: Package extension
        id: package
        run: pnpm run package-for-vscode --out socket-security.vsix
      - name: Publish to open vsx registry
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: ./.github/actions/repo/publish-vscode-extension
        id: publishToOpenVSX
        with:
          dry-run: ${{ steps.releaseMode.outputs.dryRun }}
          extension-file: socket-security.vsix
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          pre-release: false
          registry-url: https://open-vsx.org/api
          skip-duplicate: true
      - name: Publish to visual studio marketplace
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: ./.github/actions/repo/publish-vscode-extension
        with:
          dry-run: ${{ steps.releaseMode.outputs.dryRun }}
          extension-file: socket-security.vsix
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          pre-release: false
          registry-url: https://marketplace.visualstudio.com
          skip-duplicate: true
      - name: Create GitHub release
        uses: ./.github/actions/repo/create-gh-release
        # String compare, not `!`: step outputs are strings, and a non-empty
        # 'false' is truthy — `! outputs.dryRun` skipped this step on EVERY
        # run, dry or real.
        if: ${{ steps.releaseMode.outputs.dryRun != 'true' }}
        with:
          body: |
            This release is also available on the [VSCode Marketplace](https://marketplace.visualstudio.com/items?itemName=SocketSecurity.vscode-socket-security) and [OpenVSX Registry](https://open-vsx.org/extension/SocketSecurity/vscode-socket-security).
          files: socket-security.vsix
          pre-release: ${{ steps.releaseMode.outputs.preRelease }}
