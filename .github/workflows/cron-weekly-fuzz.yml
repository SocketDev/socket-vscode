name: Weekly fuzz tests
on:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/repo/setup
      - run: pnpm run test:fuzz
        env:
          FUZZ_TIME_MS: "300000"
