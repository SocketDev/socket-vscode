name: 'ci: gates'
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/repo/setup
      - name: Check proposed commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/repo/check-changes.mts range "$BASE" "$HEAD"
      - run: pnpm run check
      - name: Package extension
        run: pnpm run package-for-vscode --out "$RUNNER_TEMP/extension.vsix"
  test:
    name: Test (${{ matrix.os }})
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/repo/setup
      - name: Build extension
        run: |
          pnpm run build
          test -s out/main.cjs
      - name: Run unit tests
        run: |
          pnpm test --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/unit-tests.json"
          node --input-type=module -e "import fs from 'node:fs'; const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/unit-tests.json')); if (!report.success || !report.numPassedTests) process.exit(1)"
