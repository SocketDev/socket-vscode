on:
  push:
    tags: ['release/[0-9]+.[0-9]+.[0-9]+']

name: 'publish: extension'
run-name: 'publish: extension'

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/repo/setup
      - name: Package extension
        id: package
        run: pnpm run package-for-vscode --out socket-security.vsix
      - name: Publish to open vsx registry
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: ./.github/actions/repo/publish-vscode-extension
        id: publishToOpenVSX
        with:
          extension-file: socket-security.vsix
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          pre-release: false
          registry-url: https://open-vsx.org/api
          skip-duplicate: true
      - name: Publish to visual studio marketplace
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: ./.github/actions/repo/publish-vscode-extension
        with:
          extension-file: socket-security.vsix
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          pre-release: false
          registry-url: https://marketplace.visualstudio.com
          skip-duplicate: true
      - name: Create GitHub release
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: ./.github/actions/repo/create-gh-release
        with:
          body: |
            Extension registry listings: the [VSCode Marketplace](https://marketplace.visualstudio.com/items?itemName=SocketSecurity.vscode-socket-security) and [OpenVSX Registry](https://open-vsx.org/extension/SocketSecurity/vscode-socket-security).
          files: socket-security.vsix
          pre-release: false
